
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Tales Storybook</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffaf3;
    color: #39434d;
    transition: background .3s, color .3s;
}

header {
    background: #d9ecf7;
    color: #35566b;
    padding: 28px 15px;
    text-align: center;
}

header h1 { margin-bottom: 8px; }

nav {
    padding: 15px;
    text-align: center;
    background: white;
}

nav a {
    color: #42677d;
    text-decoration: none;
    font-weight: bold;
    margin: 0 12px;
}

button {
    padding: 11px 15px;
    border: none;
    border-radius: 8px;
    background: #78a9c2;
    color: white;
    cursor: pointer;
    margin-top: 8px;
}

button:hover { background: #5788a3; }

.container {
    max-width: 1150px;
    margin: 25px auto;
    padding: 0 15px;
    min-height: 350px;
}

.description {
    line-height: 1.6;
    color: #777;
}

#search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccdce5;
    border-radius: 9px;
    font-size: 16px;
    margin: 15px 0 22px;
}

.story-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border: 1px solid #eee4d8;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 3px 10px #00000010;
    transition: transform .2s, background .3s;
}

.card:hover { transform: translateY(-4px); }

.card img {
    display: block;
    width: 100%;
    height: 165px;
    object-fit: cover;
    background: #d9ecf7;
}

.info { padding: 15px; }

.genre {
    display: inline-block;
    background: #e5f2f8;
    color: #42677d;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.info h3 { color: #35566b; }

.info p, #storyContent {
    font-size: 14px;
    line-height: 1.8;
}

#reader {
    display: none;
    background: white;
    padding: 22px;
    border-radius: 13px;
    max-width: 800px;
    margin: auto;
}

#reader img {
    display: block;
    width: 100%;
    max-height: 380px;
    object-fit: cover;
    border-radius: 10px;
    margin: 18px 0;
}

#reader h2 { color: #35566b; }

#storyContent { white-space: pre-line; }

.back-button { background: #d99079; }

footer {
    background: #d9ecf7;
    color: #536b7a;
    text-align: center;
    padding: 22px;
    line-height: 1.8;
    margin-top: 35px;
}

/* DARK MODE */
body.dark {
    background: #121820;
    color: #e4eaf0;
}

body.dark header,
body.dark footer {
    background: #1e2b38;
    color: #e4eaf0;
}

body.dark nav,
body.dark .card,
body.dark #reader {
    background: #1e2935;
    color: #e4eaf0;
    border-color: #344252;
}

body.dark nav a,
body.dark .info h3,
body.dark #reader h2 {
    color: #d6eafa;
}

body.dark .description,
body.dark .info p {
    color: #c0ceda;
}

body.dark .genre {
    background: #30475a;
    color: #d6eafa;
}

body.dark #search {
    background: #263442;
    color: white;
    border-color: #45596b;
}

body.dark #search::placeholder { color: #c0ceda; }

@media(max-width: 500px) {
    .story-grid { grid-template-columns: 1fr; }
    #reader { padding: 15px; }
}
</style>
</head>

<body>

<header>
    <h1>📚 Little Tales</h1>
    <p>A little place for big imaginations.</p>
    <button id="themeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</header>

<nav>
    <a href="#" onclick="showHome(); return false;">Home</a>
    <a href="#stories" onclick="goToStories(); return false;">Stories</a>
</nav>

<main class="container">

<section id="home">
    <h2>Discover a Story ✨</h2>
    <p class="description">
        Explore magical places, meet new friends, and enjoy
        30 original stories for curious readers.
    </p>

    <input
        id="search"
        type="text"
        placeholder="🔍 Search stories or genres..."
        oninput="displayStories()"
    >

    <p id="resultCount" class="description"></p>
    <div id="storyList" class="story-grid"></div>
</section>

<section id="reader">
    <button class="back-button" onclick="showHome()">← Back to Stories</button>
    <div id="storyDetails"></div>
</section>

</main>

<footer>
    <p>Leo Bacolcol Jr</p>
    <p>Little Tales Storybook © 2026</p>
    <p>ITE PROJECT</p>
</footer>

const storyList = document.getElementById("storyList");
const home = document.getElementById("home");
const reader = document.getElementById("reader");
const storyDetails = document.getElementById("storyDetails");
const search = document.getElementById("search");
const resultCount = document.getElementById("resultCount");

const placeholder =
"https://placehold.co/800x400/e5edf0/35566b?text=Little+Tales";

function toggleDarkMode() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");
    document.getElementById("themeBtn").textContent =
        dark ? "☀️ Light Mode" : "🌙 Dark Mode";
}

function makeImage(img, url, title) {
    img.src = url;
    img.alt = title;
    img.loading = "lazy";

    img.onerror = function() {
        if (this.dataset.fallback) return;
        this.dataset.fallback = "true";
        this.src = placeholder;
    };
}

function displayStories() {
    const query = search.value.toLowerCase().trim();

    const filtered = stories
        .map((story, index) => ({ ...story, index }))
        .filter(story =>
            story.title.toLowerCase().includes(query) ||
            story.genre.toLowerCase().includes(query) ||
            story.content.toLowerCase().includes(query)
        );

    storyList.innerHTML = "";
    resultCount.textContent =
        filtered.length + (filtered.length === 1 ? " story found" : " stories found");

    if (filtered.length === 0) {
        storyList.textContent = "No stories found. Try another search.";
        return;
    }

    filtered.forEach(story => {
        const card = document.createElement("article");
        card.className = "card";

        const img = document.createElement("img");
        makeImage(img, story.image, story.title);

        const info = document.createElement("div");
        info.className = "info";

        const genre = document.createElement("span");
        genre.className = "genre";
        genre.textContent = story.genre;

        const title = document.createElement("h3");
        title.textContent = story.title;

        const preview = document.createElement("p");
        preview.textContent = story.content.slice(0, 95) + "...";

        const button = document.createElement("button");
        button.textContent = "Read Story";
        button.onclick = () => readStory(story.index);

        info.append(genre, title, preview, button);
        card.append(img, info);
        storyList.appendChild(card);
    });
}

function readStory(index) {
    const story = stories[index];
    if (!story) return;

    home.style.display = "none";
    reader.style.display = "block";
    storyDetails.innerHTML = "";

    const title = document.createElement("h2");
    title.textContent = story.title;

    const genre = document.createElement("span");
    genre.className = "genre";
    genre.textContent = story.genre;

    const img = document.createElement("img");
    makeImage(img, story.image, story.title);

    const content = document.createElement("p");
    content.id = "storyContent";
    content.textContent = story.content;

    storyDetails.append(title, genre, img, content);

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function showHome() {
    reader.style.display = "none";
    home.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function goToStories() {
    showHome();
    document.getElementById("search").scrollIntoView({
        behavior: "smooth"
    });
}

displayStories();
</script>

</body>
</html>
